name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main

# BẮT BUỘC: Cấp quyền ghi để Action có thể đẩy ảnh lên nhánh output
permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Nâng cấp phiên bản checkout lên v3 để ổn định hơn
      - uses: actions/checkout@v3 
      
      - uses: Platane/snk@v3
        with:
          github_user_name: TraMi2209
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
